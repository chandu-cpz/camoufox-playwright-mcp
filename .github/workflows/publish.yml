name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/camoufox-playwright-mcp
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v3

      - run: uv run ruff check .
      - run: uv run mypy src tests
      - run: uv run pytest
      - run: uv build
      - run: python -m venv /tmp/camoufox-smoke
      - run: /tmp/camoufox-smoke/bin/python -m pip install dist/*.whl
      - run: /tmp/camoufox-smoke/bin/camoufox-playwright-mcp --help
      - run: /tmp/camoufox-smoke/bin/camoufox-mcp --help
      - run: /tmp/camoufox-smoke/bin/python -m camoufox_playwright_mcp --help

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
